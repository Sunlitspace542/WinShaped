[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaped"
version = "1.0.1"
description = "Pure-Python SHAPED model reader and exporter"
requires-python = ">=3.10"

[project.scripts]
shaped-py = "shaped.__main__:main"
shaped-frontend = "shaped.frontend:main"

[tool.setuptools.packages.find]
where = ["python"]
